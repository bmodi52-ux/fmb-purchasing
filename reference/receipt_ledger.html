<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --paper:#FAF6EC;
    --paper-dim:#F1ECDD;
    --ink:#1E2A38;
    --ink-soft:#4B5763;
    --rule:#D9D2BE;
    --teal:#2F6E5C;
    --teal-dark:#234F42;
    --red:#B23B2E;
    --muted:#8A8371;
    --white:#FFFDF8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:32px 16px 80px;
  }
  .wrap{max-width:880px;margin:0 auto;}

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:8px;
  }
  header.top h1{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:30px;
    margin:0;
    letter-spacing:-0.01em;
  }
  header.top .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  /* ---- Upload card ---- */
  .card{
    background:var(--white);
    border:1px solid var(--rule);
    border-radius:2px;
    box-shadow:0 1px 0 var(--rule);
  }
  .upload-card{
    position:relative;
    display:block;
    padding:36px 28px;
    text-align:center;
    border:2px dashed var(--rule);
    background:var(--paper-dim);
    border-radius:4px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .upload-card:hover, .upload-card.drag{
    border-color:var(--teal);
    background:#EEF3EF;
  }
  .upload-card h2{
    font-family:'Zilla Slab',serif;
    font-size:20px;
    margin:0 0 6px;
  }
  .upload-card p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
  }
  .upload-icon{
    width:40px;height:40px;margin:0 auto 14px;
    color:var(--teal);
  }
  input[type=file]{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
  }

  .preview-row{
    display:flex;
    gap:16px;
    align-items:flex-start;
    margin-top:16px;
  }
  .preview-thumb{
    width:96px;height:120px;
    object-fit:cover;
    border:1px solid var(--rule);
    border-radius:2px;
    background:#fff;
  }

  /* ---- Loading ---- */
  .loading{
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  .spinner{
    width:16px;height:16px;
    border:2px solid var(--rule);
    border-top-color:var(--teal);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- Review form ---- */
  .review{
    margin-top:24px;
    padding:26px;
  }
  .review h2{
    font-family:'Zilla Slab',serif;
    font-size:20px;
    margin:0 0 4px;
  }
  .review .sub{
    font-size:12px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    margin-bottom:20px;
  }
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 16px;
    margin-bottom:22px;
  }
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    font-weight:600;
  }
  .field input{
    border:1px solid var(--rule);
    background:var(--paper-dim);
    padding:9px 10px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    border-radius:2px;
    color:var(--ink);
  }
  .field input:focus{
    outline:none;
    border-color:var(--teal);
    background:#fff;
  }

  table.items{
    width:100%;
    border-collapse:collapse;
    margin-bottom:8px;
    font-size:13px;
  }
  table.items th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--muted);
    border-bottom:1px solid var(--ink);
    padding:0 8px 8px 0;
    font-weight:600;
  }
  table.items td{
    padding:6px 8px 6px 0;
    border-bottom:1px solid var(--rule);
    vertical-align:middle;
  }
  table.items td input{
    width:100%;
    border:1px solid transparent;
    background:transparent;
    padding:5px 6px;
    font-size:13px;
    font-family:'IBM Plex Mono',monospace;
    border-radius:2px;
  }
  table.items td:first-child input{font-family:'Inter',sans-serif;}
  table.items td input:focus{
    outline:none;
    border-color:var(--teal);
    background:var(--paper-dim);
  }
  table.items td.num input{text-align:right;}
  .rm-row{
    background:none;border:none;cursor:pointer;
    color:var(--muted); font-size:16px; line-height:1;
    padding:4px;
  }
  .rm-row:hover{color:var(--red);}

  .add-row-btn{
    background:none;
    border:1px dashed var(--rule);
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:7px 12px;
    border-radius:2px;
    cursor:pointer;
    margin:6px 0 22px;
  }
  .add-row-btn:hover{border-color:var(--teal);color:var(--teal);}

  .total-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:14px;
    padding-top:12px;
    border-top:2px solid var(--ink);
    margin-bottom:24px;
  }
  .total-row label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    font-weight:600;
  }
  .total-row input{
    width:130px;
    text-align:right;
    font-family:'IBM Plex Mono',monospace;
    font-size:18px;
    font-weight:600;
    border:1px solid var(--rule);
    background:var(--paper-dim);
    padding:8px 10px;
    border-radius:2px;
  }

  .actions{display:flex;gap:10px;}
  button.primary{
    background:var(--teal);
    color:#fff;
    border:none;
    padding:12px 22px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border-radius:2px;
    cursor:pointer;
  }
  button.primary:hover{background:var(--teal-dark);}
  button.secondary{
    background:none;
    border:1px solid var(--rule);
    color:var(--ink-soft);
    padding:12px 18px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    border-radius:2px;
    cursor:pointer;
  }
  button.secondary:hover{border-color:var(--ink);color:var(--ink);}

  .error-box{
    background:#FBEDEB;
    border:1px solid var(--red);
    color:var(--red);
    padding:12px 14px;
    font-size:13px;
    border-radius:2px;
    margin-top:16px;
  }

  /* ---- Stamp confirmation ---- */
  .stamp{
    display:inline-flex;
    align-items:center;
    gap:10px;
    border:2px solid var(--teal);
    color:var(--teal-dark);
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    padding:8px 14px;
    border-radius:3px;
    transform:rotate(-1.5deg);
    background:#EEF6F2;
  }

  /* ---- Perforation divider ---- */
  .perf{
    display:flex;
    align-items:center;
    gap:6px;
    margin:40px 0 24px;
  }
  .perf .line{
    flex:1;
    border-top:2px dashed var(--rule);
  }
  .perf span{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--muted);
    text-transform:uppercase;
  }

  /* ---- Ledger ---- */
  .ledger-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .ledger-head h2{
    font-family:'Zilla Slab',serif;
    font-size:20px;
    margin:0;
  }
  .ledger-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }
  table.ledger{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    background:var(--white);
    border:1px solid var(--rule);
  }
  table.ledger th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--muted);
    padding:10px 12px;
    border-bottom:1px solid var(--ink);
    font-weight:600;
    background:var(--paper-dim);
  }
  table.ledger td{
    padding:10px 12px;
    border-bottom:1px solid var(--rule);
    vertical-align:top;
  }
  table.ledger tr:last-child td{border-bottom:none;}
  table.ledger td.code{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    color:var(--teal-dark);
    white-space:nowrap;
  }
  table.ledger td.amt{
    font-family:'IBM Plex Mono',monospace;
    text-align:right;
    white-space:nowrap;
  }
  .empty-ledger{
    padding:28px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    border:1px dashed var(--rule);
    border-radius:2px;
  }

  .hidden{display:none !important;}
  .del-btn{
    background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;
  }
  .del-btn:hover{color:var(--red);}

  /* ---- Modal (replaces native alert/confirm/prompt, which are blocked here) ---- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(30,42,56,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-box{
    background:var(--white);
    border:1px solid var(--rule);
    border-radius:3px;
    max-width:420px;
    width:100%;
    padding:24px;
    box-shadow:0 8px 30px rgba(30,42,56,0.25);
  }
  .modal-box h3{
    font-family:'Zilla Slab',serif;
    font-size:19px;
    margin:0 0 10px;
  }
  .modal-box p{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0 0 16px;
    white-space:pre-line;
  }
  .modal-box input{
    width:100%;
    border:1px solid var(--rule);
    background:var(--paper-dim);
    padding:9px 10px;
    font-size:14px;
    font-family:'IBM Plex Mono',monospace;
    border-radius:2px;
    margin-bottom:16px;
  }
  .modal-box input:focus{outline:none;border-color:var(--teal);background:#fff;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px;}
  .modal-actions button.primary.danger{background:var(--red);}
  .modal-actions button.primary.danger:hover{background:#8f2f24;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Receipt Ledger</h1>
    <span class="tag">Scan &middot; Review &middot; Record</span>
  </header>

  <!-- UPLOAD -->
  <label id="uploadCard" for="fileInput" class="upload-card">
    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3M12 3v12M7 8l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h2>Upload or scan a receipt</h2>
    <p>Tap to choose a photo, or drag a file here. JPG, PNG or PDF photo.</p>
    <input type="file" id="fileInput" accept="image/*,application/pdf">
  </label>

  <div id="previewArea"></div>
  <div id="loadingArea"></div>
  <div id="errorArea"></div>

  <!-- REVIEW FORM -->
  <div id="reviewCard" class="card review hidden"></div>

  <div class="perf"><div class="line"></div><span>Ledger</span><div class="line"></div></div>

  <div class="ledger-head">
    <h2>All entries</h2>
    <div style="display:flex;align-items:center;gap:14px;">
      <span class="ledger-count" id="ledgerCount">0 entries</span>
      <button class="secondary" id="refreshBtn" style="padding:8px 14px;font-size:13px;">Refresh</button>
      <button class="secondary" id="exportBtn" style="padding:8px 14px;font-size:13px;">Export to Excel</button>
      <button class="secondary" id="clearAllBtn" style="padding:8px 14px;font-size:13px;border-color:var(--red);color:var(--red);">Clear all entries</button>
    </div>
  </div>
  <div id="ledgerArea"></div>

  <div id="modalRoot"></div>

</div>

<script>
let currentItems = [];
let currentImageB64 = null;
let currentImageMedia = null;
let currentImageDims = null;

const modalRoot = document.getElementById('modalRoot');

function closeModal(){
  modalRoot.innerHTML = '';
}

function showInfoModal(title, message){
  modalRoot.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal-box">
        <h3>${escapeAttr(title)}</h3>
        <p>${escapeAttr(message)}</p>
        <div class="modal-actions">
          <button class="primary" id="modalOkBtn">OK</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalOkBtn').onclick = closeModal;
}

// Returns a Promise<boolean>. If requireText is set, the confirm button stays
// disabled until the user types that exact text into the field.
function showConfirmModal({ title, message, confirmLabel = 'Confirm', danger = false, requireText = null }){
  return new Promise((resolve) => {
    modalRoot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-box">
          <h3>${escapeAttr(title)}</h3>
          <p>${escapeAttr(message)}</p>
          ${requireText ? `<input type="text" id="modalConfirmInput" placeholder="Type ${escapeAttr(requireText)} to confirm"/>` : ''}
          <div class="modal-actions">
            <button class="secondary" id="modalCancelBtn">Cancel</button>
            <button class="primary ${danger ? 'danger' : ''}" id="modalConfirmBtn" ${requireText ? 'disabled' : ''}>${escapeAttr(confirmLabel)}</button>
          </div>
        </div>
      </div>`;
    const confirmBtn = document.getElementById('modalConfirmBtn');
    if(requireText){
      const input = document.getElementById('modalConfirmInput');
      input.addEventListener('input', () => {
        confirmBtn.disabled = input.value !== requireText;
      });
      input.focus();
    }
    document.getElementById('modalCancelBtn').onclick = () => { closeModal(); resolve(false); };
    confirmBtn.onclick = () => { closeModal(); resolve(true); };
  });
}

// ---- ABN Lookup: free web service, but requires a personal GUID from abr.business.gov.au ----
async function getAbnGuid(){
  try{
    const r = await window.storage.get('settings:abnGuid', false);
    return (r && r.value) ? r.value : null;
  }catch(e){ return null; }
}
async function saveAbnGuid(guid){
  await window.storage.set('settings:abnGuid', guid, false);
}

function showAbnSettingsModal(onSaved){
  modalRoot.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal-box">
        <h3>Connect ABN Lookup</h3>
        <p>Looking up a vendor name from an ABN uses the free ABN Lookup web service, which needs a personal access key (GUID). Register for one at abr.business.gov.au/Tools/WebServices — it's free and arrives by email. Paste it below once you have it; it's saved so you only need to do this once.</p>
        <input type="text" id="abnGuidInput" placeholder="Paste your ABN Lookup GUID"/>
        <div class="modal-actions">
          <button class="secondary" id="abnGuidCancelBtn">Cancel</button>
          <button class="primary" id="abnGuidSaveBtn">Save</button>
        </div>
      </div>
    </div>`;
  document.getElementById('abnGuidCancelBtn').onclick = closeModal;
  document.getElementById('abnGuidSaveBtn').onclick = async () => {
    const val = document.getElementById('abnGuidInput').value.trim();
    if(!val) return;
    await saveAbnGuid(val);
    closeModal();
    if(onSaved) onSaved();
  };
}

function abnLookupJSONP(abn, guid){
  return new Promise((resolve, reject) => {
    const cbName = 'abnCb_' + Math.random().toString(36).slice(2);
    const cleanup = () => { delete window[cbName]; if(script.parentNode) script.remove(); clearTimeout(timer); };
    window[cbName] = (data) => { cleanup(); resolve(data || {}); };
    const script = document.createElement('script');
    script.src = `https://abr.business.gov.au/json/AbnDetails.aspx?abn=${encodeURIComponent(abn)}&callback=${cbName}&guid=${encodeURIComponent(guid)}`;
    script.onerror = () => { cleanup(); reject(new Error('Could not reach the ABN Lookup service.')); };
    const timer = setTimeout(() => { cleanup(); reject(new Error('ABN Lookup request timed out.')); }, 8000);
    document.body.appendChild(script);
  });
}

const fileInput = document.getElementById('fileInput');
const uploadCard = document.getElementById('uploadCard');
const previewArea = document.getElementById('previewArea');
const loadingArea = document.getElementById('loadingArea');
const errorArea = document.getElementById('errorArea');
const reviewCard = document.getElementById('reviewCard');

fileInput.addEventListener('change', (e) => {
  if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
});
uploadCard.addEventListener('dragover', (e)=>{e.preventDefault(); uploadCard.classList.add('drag');});
uploadCard.addEventListener('dragleave', ()=> uploadCard.classList.remove('drag'));
uploadCard.addEventListener('drop', (e)=>{
  e.preventDefault(); uploadCard.classList.remove('drag');
  if(e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

function base64ToUint8Array(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function renderPdfFirstPageToDataUrl(base64, scale){
  const bytes = base64ToUint8Array(base64);
  const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return canvas.toDataURL('image/jpeg', 0.92);
}

function resizeImage(dataUrl, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve({ dataUrl: canvas.toDataURL('image/jpeg', quality), width, height });
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function handleFile(file){
  errorArea.innerHTML = '';
  reviewCard.classList.add('hidden');
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
  const reader = new FileReader();
  reader.onload = async () => {
    const raw = reader.result; // data:<type>;base64,...
    const commaIdx = raw.indexOf(',');
    const rawBase64 = raw.substring(commaIdx+1);

    if(isPdf){
      setLoading(true, 'Rendering PDF...');
      try{
        if(!window.pdfjsLib) throw new Error('PDF renderer unavailable');
        const rasterDataUrl = await renderPdfFirstPageToDataUrl(rawBase64, 2);
        const resized = await resizeImage(rasterDataUrl, 1400, 0.85);
        const result = resized.dataUrl;
        const idx = result.indexOf(',');
        currentImageMedia = result.substring(5, result.indexOf(';'));
        currentImageB64 = result.substring(idx+1);
        currentImageDims = { width: resized.width, height: resized.height };
        previewArea.innerHTML = `<div class="preview-row"><img class="preview-thumb" src="${result}"/></div>`;
        setLoading(false);
        extractReceipt();
      }catch(renderErr){
        // Fall back to sending the raw PDF as a document — extraction still works,
        // it just won't have a raster image available for the Excel export.
        currentImageMedia = 'application/pdf';
        currentImageB64 = rawBase64;
        currentImageDims = { width:null, height:null };
        previewArea.innerHTML = `
          <div class="preview-row">
            <div class="preview-thumb" style="display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);text-align:center;padding:6px;">
              PDF<br/>${escapeAttr(file.name || 'receipt.pdf')}
            </div>
          </div>`;
        setLoading(false);
        extractReceipt();
      }
      return;
    }

    let resized;
    try{
      resized = await resizeImage(raw, 1400, 0.82);
    }catch(e){
      resized = { dataUrl: raw, width:null, height:null };
    }
    const result = resized.dataUrl;
    const resultCommaIdx = result.indexOf(',');
    currentImageMedia = result.substring(5, result.indexOf(';'));
    currentImageB64 = result.substring(resultCommaIdx+1);
    currentImageDims = { width: resized.width, height: resized.height };
    previewArea.innerHTML = `<div class="preview-row"><img class="preview-thumb" src="${result}"/></div>`;
    extractReceipt();
  };
  reader.readAsDataURL(file);
}

function setLoading(on, msg){
  loadingArea.innerHTML = on ? `<div class="loading"><div class="spinner"></div><span>${msg || 'Reading receipt...'}</span></div>` : '';
}

async function extractReceipt(){
  setLoading(true, currentImageMedia === 'application/pdf' ? 'Reading PDF...' : 'Reading receipt...');
  try{
    const isPdf = currentImageMedia === 'application/pdf';
    const contentBlock = isPdf
      ? { type: "document", source: { type: "base64", media_type: "application/pdf", data: currentImageB64 } }
      : { type: "image", source: { type: "base64", media_type: currentImageMedia, data: currentImageB64 } };
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: "You extract structured data from photos or PDFs of receipts or invoices. Respond with ONLY raw JSON, no markdown fences, no commentary, matching exactly this schema: {\"vendor\":string|null,\"abn\":string|null,\"date\":string|null,\"invoiceNo\":string|null,\"items\":[{\"description\":string,\"qty\":number|null,\"unitPrice\":number|null,\"total\":number|null}],\"total\":number|null}. \"abn\" is the Australian Business Number printed on the receipt (often labelled ABN or A.B.N.) — return it as 11 digits only, no spaces; if not present use null. Use the receipt's printed date as-is (any format). Strip currency symbols from numbers. If a value is unreadable or absent, use null. Include every distinct line item you can see.",
        messages: [
          {
            role: "user",
            content: [
              contentBlock,
              { type: "text", text: "Extract this receipt into the JSON schema." }
            ]
          }
        ]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock) throw new Error("No response from extraction.");
    let clean = textBlock.text.trim().replace(/^```json/,'').replace(/^```/,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(clean);
    setLoading(false);
    renderReview(parsed);
  }catch(err){
    setLoading(false);
    errorArea.innerHTML = `<div class="error-box">Could not read that receipt automatically (${err.message}). You can still fill in the details manually below.</div>`;
    renderReview({vendor:'',date:'',invoiceNo:'',items:[{description:'',qty:1,unitPrice:0,total:0}],total:0});
  }
}

function toNum(v){
  if(v === '' || v === null || v === undefined) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}
function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }

// Line total = qty * unit price whenever both are present; receipt total = sum of line totals.
function recalcItemTotal(item){
  const q = toNum(item.qty), p = toNum(item.unitPrice);
  if(q !== null && p !== null) item.total = round2(q * p);
}
function recalcReceiptTotal(){
  const sum = currentItems.reduce((acc, it) => {
    const t = toNum(it.total);
    return t !== null ? acc + t : acc;
  }, 0);
  const totalInput = document.getElementById('f-total');
  if(totalInput) totalInput.value = round2(sum);
}

function abnLookupUrl(abn){
  const digits = String(abn || '').replace(/\D/g, '');
  return digits ? `https://abr.business.gov.au/ABN/View?abn=${digits}` : null;
}

function updateAbnLink(){
  const abnVal = document.getElementById('f-abn').value;
  const linkEl = document.getElementById('abnLink');
  const url = abnLookupUrl(abnVal);
  if(linkEl){
    if(url){ linkEl.href = url; linkEl.classList.remove('hidden'); }
    else { linkEl.classList.add('hidden'); }
  }
}

async function handleAbnLookupClick(){
  const abnVal = document.getElementById('f-abn').value.replace(/\D/g, '');
  const lookupBtn = document.getElementById('abnLookupBtn');
  if(!abnVal || abnVal.length !== 11){
    showInfoModal('Check the ABN', 'Enter a valid 11-digit ABN before looking it up.');
    return;
  }
  const guid = await getAbnGuid();
  if(!guid){
    showAbnSettingsModal(() => handleAbnLookupClick());
    return;
  }
  lookupBtn.disabled = true;
  lookupBtn.textContent = 'Looking up...';
  try{
    const result = await abnLookupJSONP(abnVal, guid);
    if(result.Message){ throw new Error(result.Message); }
    const name = result.EntityName || (result.BusinessName && result.BusinessName[0]) || null;
    if(!name) throw new Error('No registered name found for this ABN.');
    document.getElementById('f-vendor').value = name;
    lookupBtn.textContent = 'Looked up ✓';
    setTimeout(() => { lookupBtn.textContent = 'Look up vendor'; }, 2500);
  }catch(err){
    showInfoModal('ABN lookup failed', err.message);
    lookupBtn.textContent = 'Look up vendor';
  }finally{
    lookupBtn.disabled = false;
  }
}

function renderReview(data){
  currentItems = (data.items && data.items.length) ? data.items.map(it => ({
    description: it.description || '',
    qty: it.qty ?? '',
    unitPrice: it.unitPrice ?? '',
    total: it.total ?? ''
  })) : [{description:'',qty:'',unitPrice:'',total:''}];
  currentItems.forEach(recalcItemTotal);
  const computedTotal = currentItems.reduce((acc, it) => {
    const t = toNum(it.total);
    return t !== null ? acc + t : acc;
  }, 0);

  reviewCard.classList.remove('hidden');
  reviewCard.innerHTML = `
    <h2>Review extracted details</h2>
    <div class="sub">Check each field below and correct anything before saving to the ledger.</div>
    <div class="field-grid">
      <div class="field"><label>Vendor</label><input id="f-vendor" value="${escapeAttr(data.vendor||'')}"/></div>
      <div class="field"><label>Date</label><input id="f-date" value="${escapeAttr(data.date||'')}"/></div>
      <div class="field full"><label>Invoice / Receipt No.</label><input id="f-invoice" value="${escapeAttr(data.invoiceNo||'')}"/></div>
      <div class="field full">
        <label>ABN</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="f-abn" value="${escapeAttr(data.abn||'')}" style="flex:1;"/>
          <button type="button" class="secondary" id="abnLookupBtn" style="padding:9px 12px;font-size:12px;white-space:nowrap;">Look up vendor</button>
        </div>
        <a id="abnLink" href="#" target="_blank" rel="noopener" class="hidden" style="font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--teal-dark);margin-top:2px;">View on ABN Lookup ↗</a>
      </div>
    </div>
    <table class="items">
      <thead><tr>
        <th style="width:42%">Description</th>
        <th style="width:12%">Qty</th>
        <th style="width:18%">Unit price</th>
        <th style="width:18%">Total</th>
        <th style="width:4%"></th>
      </tr></thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <button class="add-row-btn" id="addRowBtn">+ Add line item</button>
    <div class="total-row">
      <label>Receipt total</label>
      <input id="f-total" value="${escapeAttr(round2(computedTotal))}"/>
    </div>
    <div class="actions">
      <button class="primary" id="saveBtn">Save to ledger</button>
      <button class="secondary" id="cancelBtn">Discard</button>
    </div>
  `;
  drawItemRows();
  document.getElementById('addRowBtn').onclick = () => {
    currentItems.push({description:'',qty:'',unitPrice:'',total:''});
    drawItemRows();
  };
  document.getElementById('f-abn').addEventListener('input', updateAbnLink);
  document.getElementById('abnLookupBtn').addEventListener('click', handleAbnLookupClick);
  updateAbnLink();
  document.getElementById('saveBtn').onclick = saveEntry;
  document.getElementById('cancelBtn').onclick = resetUpload;
  reviewCard.scrollIntoView({behavior:'smooth', block:'start'});
}

function drawItemRows(){
  const body = document.getElementById('itemsBody');
  body.innerHTML = currentItems.map((it, i) => `
    <tr>
      <td><input data-i="${i}" data-f="description" value="${escapeAttr(it.description)}"/></td>
      <td class="num"><input data-i="${i}" data-f="qty" value="${escapeAttr(it.qty)}"/></td>
      <td class="num"><input data-i="${i}" data-f="unitPrice" value="${escapeAttr(it.unitPrice)}"/></td>
      <td class="num"><input data-i="${i}" data-f="total" value="${escapeAttr(it.total)}"/></td>
      <td><button class="rm-row" data-i="${i}" title="Remove row">&times;</button></td>
    </tr>
  `).join('');
  body.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', (e) => {
      const i = e.target.dataset.i, f = e.target.dataset.f;
      currentItems[i][f] = e.target.value;
      if(f === 'qty' || f === 'unitPrice'){
        recalcItemTotal(currentItems[i]);
        const totalInput = body.querySelector(`input[data-i="${i}"][data-f="total"]`);
        if(totalInput) totalInput.value = currentItems[i].total;
      }
      recalcReceiptTotal();
    });
  });
  body.querySelectorAll('.rm-row').forEach(btn => {
    btn.addEventListener('click', (e) => {
      currentItems.splice(parseInt(e.target.dataset.i), 1);
      if(currentItems.length===0) currentItems.push({description:'',qty:'',unitPrice:'',total:''});
      drawItemRows();
      recalcReceiptTotal();
    });
  });
}

function resetUpload(){
  reviewCard.classList.add('hidden');
  previewArea.innerHTML = '';
  errorArea.innerHTML = '';
  fileInput.value = '';
  currentImageB64 = null;
  currentImageMedia = null;
  currentImageDims = null;
}

function escapeAttr(v){
  return String(v ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

async function nextEntryCode(){
  let keys = [];
  try{
    const res = await window.storage.list('receipt:', false);
    keys = (res && res.keys) ? res.keys : [];
  }catch(e){ keys = []; }
  let maxNum = 0;
  keys.forEach(k => {
    const m = k.match(/^receipt:(\d+)$/);
    if(m) maxNum = Math.max(maxNum, parseInt(m[1]));
  });
  const next = maxNum + 1;
  return 'RCPT-' + String(next).padStart(4,'0');
}

async function saveEntry(){
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving...';
  try{
    currentItems.forEach(recalcItemTotal); // final safety-net recompute: total = qty * unit price
    const code = await nextEntryCode();
    const entry = {
      code,
      vendor: document.getElementById('f-vendor').value,
      abn: document.getElementById('f-abn').value.replace(/\D/g, ''),
      date: document.getElementById('f-date').value,
      invoiceNo: document.getElementById('f-invoice').value,
      items: currentItems.filter(it => (it.description||'').trim() !== ''),
      total: document.getElementById('f-total').value,
      savedAt: new Date().toISOString()
    };
    const num = code.split('-')[1];
    await window.storage.set('receipt:' + num, JSON.stringify(entry), false);
    if(currentImageB64){
      const imageRecord = {
        code,
        mediaType: currentImageMedia,
        data: currentImageB64,
        width: currentImageDims ? currentImageDims.width : null,
        height: currentImageDims ? currentImageDims.height : null
      };
      await window.storage.set('receipt-image:' + num, JSON.stringify(imageRecord), false);
    }
    resetUpload();
    await loadLedger();
    flashStamp(code);
  }catch(err){
    errorArea.innerHTML = `<div class="error-box">Could not save this entry (${err.message}). Please try again.</div>`;
  }finally{
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save to ledger';
  }
}

function flashStamp(code){
  const box = document.createElement('div');
  box.style.margin = '18px 0';
  box.innerHTML = `<div class="stamp">✓ Saved as ${code}</div>`;
  previewArea.after(box);
  setTimeout(() => box.remove(), 4500);
}

async function loadAllEntries(){
  let keys = [];
  try{
    const res = await window.storage.list('receipt:', false);
    keys = (res && res.keys) ? res.keys : [];
  }catch(e){ return []; }
  const entries = [];
  for(const k of keys){
    try{
      const r = await window.storage.get(k, false);
      if(r && r.value) entries.push(JSON.parse(r.value));
    }catch(e){ /* skip unreadable key */ }
  }
  entries.sort((a,b) => (a.code < b.code ? 1 : -1));
  return entries;
}

async function loadImageForEntry(code){
  const num = code.split('-')[1];
  try{
    const r = await window.storage.get('receipt-image:' + num, false);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){ /* no image stored for this entry */ }
  return null;
}

async function loadLedger(){
  const entries = await loadAllEntries();
  const ledgerArea = document.getElementById('ledgerArea');
  document.getElementById('ledgerCount').textContent = entries.length + (entries.length===1 ? ' entry' : ' entries');
  if(entries.length === 0){
    ledgerArea.innerHTML = `<div class="empty-ledger">No entries yet — scan a receipt above to add your first one.</div>`;
    return;
  }
  ledgerArea.innerHTML = `
    <table class="ledger">
      <thead><tr>
        <th>Code</th><th>Vendor</th><th>Date</th><th>Invoice No.</th><th>Items</th><th style="text-align:right">Total</th><th></th>
      </tr></thead>
      <tbody>
        ${entries.map(e => `
          <tr>
            <td class="code">${escapeAttr(e.code)}</td>
            <td>${escapeAttr(e.vendor)}</td>
            <td>${escapeAttr(e.date)}</td>
            <td>${escapeAttr(e.invoiceNo)}</td>
            <td>${(e.items||[]).length}</td>
            <td class="amt">${e.total !== '' && e.total !== null && e.total !== undefined ? '$' + Number(e.total).toFixed(2) : '—'}</td>
            <td><button class="del-btn" data-code="${escapeAttr(e.code.split('-')[1])}">remove</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  ledgerArea.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const num = e.target.dataset.code;
      const confirmed = await showConfirmModal({
        title: 'Remove this entry?',
        message: `Entry RCPT-${num} and its saved photo will be permanently removed from the ledger.`,
        confirmLabel: 'Remove',
        danger: true
      });
      if(confirmed){
        try{
          await window.storage.delete('receipt:' + num, false);
          await window.storage.delete('receipt-image:' + num, false);
        }catch(err){ /* continue and refresh regardless */ }
        loadLedger();
      }
    });
  });
}

const CURRENCY_FMT = '"$"#,##0.00';
const THIN_BORDER_MUTED = { style: 'thin', color: { argb: 'FFD9D2BE' } };
const THIN_BORDER_INK = { style: 'thin', color: { argb: 'FF1E2A38' } };

function colLetter(n){
  let s = '';
  while(n > 0){
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function styleHeaderRow(row){
  row.eachCell(cell => {
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2F6E5C' } };
    cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
    cell.alignment = { vertical: 'middle' };
    cell.border = { top: THIN_BORDER_INK, left: THIN_BORDER_INK, bottom: THIN_BORDER_INK, right: THIN_BORDER_INK };
  });
  row.height = 20;
}

function styleDataRow(row, zebra){
  row.eachCell(cell => {
    cell.border = { top: THIN_BORDER_MUTED, left: THIN_BORDER_MUTED, bottom: THIN_BORDER_MUTED, right: THIN_BORDER_MUTED };
    if(zebra) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF1ECDD' } };
  });
}

function styleTotalRow(row){
  row.eachCell(cell => {
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEAE3CE' } };
    cell.font = { bold: true, color: { argb: 'FF1E2A38' } };
    cell.border = { top: { style: 'medium', color: { argb: 'FF1E2A38' } }, bottom: { style: 'thin', color: { argb: 'FF1E2A38' } } };
  });
}

function asNumber(v){
  if(v === '' || v === null || v === undefined) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

document.getElementById('exportBtn').addEventListener('click', async () => {
  const exportBtn = document.getElementById('exportBtn');
  const entries = await loadAllEntries();
  if(entries.length === 0){ showInfoModal('Nothing to export', 'No entries to export yet.'); return; }
  exportBtn.disabled = true;
  exportBtn.textContent = 'Building file...';

  try{
    const workbook = new ExcelJS.Workbook();
    workbook.creator = 'Receipt Ledger';
    workbook.created = new Date();

    const ordered = entries.slice().reverse(); // oldest to newest

    // ---- Sheet 1: Summary (one row per receipt) ----
    const summarySheet = workbook.addWorksheet('Summary');
    summarySheet.columns = [
      { header: 'Entry Code', key: 'code', width: 14 },
      { header: 'Vendor', key: 'vendor', width: 26 },
      { header: 'ABN', key: 'abn', width: 16 },
      { header: 'Date', key: 'date', width: 14 },
      { header: 'Invoice No.', key: 'invoiceNo', width: 16 },
      { header: 'Item Count', key: 'itemCount', width: 12 },
      { header: 'Receipt Total', key: 'total', width: 16 },
      { header: 'Saved At', key: 'savedAt', width: 20 }
    ];
    summarySheet.getRow(1).font = { bold: true };
    let summaryGrandTotal = 0;
    ordered.forEach(e => {
      const totalNum = asNumber(e.total);
      if(totalNum !== null) summaryGrandTotal += totalNum;
      const row = summarySheet.addRow({
        code: e.code,
        vendor: e.vendor,
        abn: e.abn || '',
        date: e.date,
        invoiceNo: e.invoiceNo,
        itemCount: (e.items || []).length,
        total: totalNum,
        savedAt: e.savedAt ? new Date(e.savedAt) : null
      });
      if(e.abn){
        const cell = row.getCell('abn');
        cell.value = { text: e.abn, hyperlink: `https://abr.business.gov.au/ABN/View?abn=${e.abn}` };
        cell.font = { color: { argb: 'FF2F6E5C' }, underline: true };
      }
    });
    summarySheet.addRow({}); // one blank row before the grand total
    const grandTotalRow = summarySheet.addRow({
      itemCount: 'Grand Total',
      total: summaryGrandTotal
    });
    summarySheet.getColumn('total').numFmt = CURRENCY_FMT;
    summarySheet.getColumn('savedAt').numFmt = 'yyyy-mm-dd hh:mm';

    styleHeaderRow(summarySheet.getRow(1));
    for(let r = 2; r <= ordered.length + 1; r++){
      styleDataRow(summarySheet.getRow(r), (r % 2 === 0));
    }
    styleTotalRow(grandTotalRow);
    summarySheet.views = [{ state: 'frozen', ySplit: 1 }];
    summarySheet.autoFilter = { from: 'A1', to: colLetter(summarySheet.columns.length) + '1' };
    summarySheet.getColumn('savedAt').numFmt = 'yyyy-mm-dd hh:mm';

    // ---- Sheet 2: Line Items (one row per item) ----
    const itemsSheet = workbook.addWorksheet('Line Items');
    itemsSheet.columns = [
      { header: 'Entry Code', key: 'code', width: 14 },
      { header: 'Vendor', key: 'vendor', width: 26 },
      { header: 'Date', key: 'date', width: 14 },
      { header: 'Invoice No.', key: 'invoiceNo', width: 16 },
      { header: 'Item Description', key: 'description', width: 34 },
      { header: 'Qty', key: 'qty', width: 8 },
      { header: 'Unit Price', key: 'unitPrice', width: 14 },
      { header: 'Line Total', key: 'lineTotal', width: 14 },
      { header: 'Receipt Total', key: 'receiptTotal', width: 16 },
      { header: 'Saved At', key: 'savedAt', width: 20 }
    ];
    itemsSheet.getRow(1).font = { bold: true };
    ordered.forEach(e => {
      const items = (e.items && e.items.length) ? e.items : [{description:'',qty:'',unitPrice:'',total:''}];
      items.forEach(it => {
        itemsSheet.addRow({
          code: e.code,
          vendor: e.vendor,
          date: e.date,
          invoiceNo: e.invoiceNo,
          description: it.description,
          qty: asNumber(it.qty),
          unitPrice: asNumber(it.unitPrice),
          lineTotal: asNumber(it.total),
          receiptTotal: asNumber(e.total),
          savedAt: e.savedAt ? new Date(e.savedAt) : null
        });
      });
    });
    itemsSheet.getColumn('unitPrice').numFmt = CURRENCY_FMT;
    itemsSheet.getColumn('lineTotal').numFmt = CURRENCY_FMT;
    itemsSheet.getColumn('receiptTotal').numFmt = CURRENCY_FMT;
    itemsSheet.getColumn('savedAt').numFmt = 'yyyy-mm-dd hh:mm';

    styleHeaderRow(itemsSheet.getRow(1));
    const lastItemRow = itemsSheet.rowCount;
    for(let r = 2; r <= lastItemRow; r++){
      styleDataRow(itemsSheet.getRow(r), (r % 2 === 0));
    }
    itemsSheet.views = [{ state: 'frozen', ySplit: 1 }];
    itemsSheet.autoFilter = { from: 'A1', to: colLetter(itemsSheet.columns.length) + '1' };

    // ---- Sheet 3: Receipt Images (labeled with entry code) ----
    const imagesSheet = workbook.addWorksheet('Receipt Images');
    imagesSheet.getColumn(1).width = 16;
    imagesSheet.getColumn(2).width = 46;

    const titleRow = imagesSheet.getRow(1);
    titleRow.getCell(1).value = 'Entry Code';
    titleRow.getCell(2).value = 'Photo';
    styleHeaderRow(titleRow);
    imagesSheet.views = [{ state: 'frozen', ySplit: 1 }];

    const PX_PER_ROW = 15; // approx default row height in px
    const MAX_IMG_WIDTH = 320;
    let cursorRow = 1; // account for the title row above (0-indexed for image placement)

    let anyImages = false;
    for(const e of ordered){
      const img = await loadImageForEntry(e.code);
      const labelCell = imagesSheet.getCell(cursorRow + 1, 1);
      labelCell.value = e.code;
      labelCell.font = { bold: true, color: { argb: 'FF2F6E5C' } };
      labelCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEF3EF' } };
      labelCell.alignment = { vertical: 'middle', horizontal: 'center' };
      labelCell.border = { top: THIN_BORDER_MUTED, left: THIN_BORDER_MUTED, bottom: THIN_BORDER_MUTED, right: THIN_BORDER_MUTED };

      if(img && img.data && img.mediaType !== 'application/pdf'){
        anyImages = true;
        let w = img.width || 600, h = img.height || 800;
        if(w > MAX_IMG_WIDTH){
          h = Math.round(h * (MAX_IMG_WIDTH / w));
          w = MAX_IMG_WIDTH;
        }
        const ext = (img.mediaType || 'image/jpeg').includes('png') ? 'png' : 'jpeg';
        const imageId = workbook.addImage({ base64: img.data, extension: ext });
        imagesSheet.addImage(imageId, {
          tl: { col: 1, row: cursorRow },
          ext: { width: w, height: h }
        });
        const rowsSpanned = Math.ceil(h / PX_PER_ROW) + 2;
        for(let rr = cursorRow + 1; rr <= cursorRow + rowsSpanned; rr++){
          imagesSheet.getCell(rr, 2).border = { left: THIN_BORDER_MUTED, right: THIN_BORDER_MUTED };
        }
        imagesSheet.getCell(cursorRow + rowsSpanned, 2).border = { left: THIN_BORDER_MUTED, right: THIN_BORDER_MUTED, bottom: THIN_BORDER_MUTED };
        imagesSheet.getCell(cursorRow + rowsSpanned, 1).border = { ...labelCell.border, bottom: THIN_BORDER_MUTED };
        cursorRow += rowsSpanned;
      } else if(img && img.mediaType === 'application/pdf'){
        const pdfCell = imagesSheet.getCell(cursorRow + 1, 2);
        pdfCell.value = '(original receipt was a PDF — not shown here as an image)';
        pdfCell.font = { italic: true, color: { argb: 'FF8A8371' } };
        pdfCell.border = { top: THIN_BORDER_MUTED, left: THIN_BORDER_MUTED, bottom: THIN_BORDER_MUTED, right: THIN_BORDER_MUTED };
        cursorRow += 3;
      } else {
        const noImgCell = imagesSheet.getCell(cursorRow + 1, 2);
        noImgCell.value = '(no image saved for this entry)';
        noImgCell.font = { italic: true, color: { argb: 'FF8A8371' } };
        noImgCell.border = { top: THIN_BORDER_MUTED, left: THIN_BORDER_MUTED, bottom: THIN_BORDER_MUTED, right: THIN_BORDER_MUTED };
        cursorRow += 3;
      }
    }
    if(!anyImages){
      imagesSheet.getCell(2, 4).value = 'No receipt photos were saved with these entries.';
      imagesSheet.getCell(2, 4).font = { italic: true, color: { argb: 'FF8A8371' } };
    }

    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'receipt_ledger.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    showInfoModal('Export failed', err.message);
  }finally{
    exportBtn.disabled = false;
    exportBtn.textContent = 'Export to Excel';
  }
});

document.getElementById('clearAllBtn').addEventListener('click', async () => {
  const entries = await loadAllEntries();
  if(entries.length === 0){ showInfoModal('Nothing to clear', 'The ledger is already empty.'); return; }
  const confirmed = await showConfirmModal({
    title: 'Clear all entries?',
    message: `This will permanently delete all ${entries.length} entries and their saved photos. This cannot be undone.`,
    confirmLabel: 'Delete everything',
    danger: true,
    requireText: 'DELETE'
  });
  if(!confirmed) return;

  const btn = document.getElementById('clearAllBtn');
  btn.disabled = true;
  btn.textContent = 'Clearing...';
  try{
    const dataKeys = await window.storage.list('receipt:', false);
    const imageKeys = await window.storage.list('receipt-image:', false);
    const allKeys = [...((dataKeys && dataKeys.keys) || []), ...((imageKeys && imageKeys.keys) || [])];
    for(const k of allKeys){
      try{ await window.storage.delete(k, false); }catch(e){ /* skip keys that fail to delete */ }
    }
    await loadLedger();
  }catch(err){
    showInfoModal('Could not clear the ledger', err.message);
  }finally{
    btn.disabled = false;
    btn.textContent = 'Clear all entries';
  }
});

document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = 'Refreshing...';
  try{
    await loadLedger();
  }finally{
    btn.disabled = false;
    btn.textContent = 'Refresh';
  }
});

loadLedger();
</script>
</body>
</html>
